<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="theme-color" content="#2A2622">
  <title>eBilal</title>
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:ital@0;1&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="wash"></div>

  <header class="topbar">
    <a class="brand" href="https://livemasjid.com" title="Powered by Livemasjid">
      <span class="brand-mark">◉</span>
      <span class="brand-text">eBilal</span>
    </a>
    <div class="topbar-right">
      <div class="status-pill" id="status-pill">
        <span class="dot" id="status-dot"></span>
        <span id="status">connecting…</span>
      </div>
      <button class="gear-btn" id="gear-btn" onclick="toggleSettings()" aria-label="Settings" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 4a7 7 0 0 0-.1-1.13l2.03-1.58-2-3.46-2.39.96a7 7 0 0 0-1.96-1.13L15.5 2h-4l-.98 2.63a7 7 0 0 0-1.96 1.13l-2.39-.96-2 3.46 2.03 1.58a7.1 7.1 0 0 0 0 2.26L2.17 15.2l2 3.46 2.39-.96c.59.47 1.25.85 1.96 1.13L9.5 22h4l.98-2.63a7 7 0 0 0 1.96-1.13l2.39.96 2-3.46-2.03-1.58c.06-.37.1-.75.1-1.13z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="container">

    <!-- Now playing -->
    <section class="now-playing card" id="now-playing" hidden>
      <div class="np-left">
        <div class="np-eq" id="np-eq"><span></span><span></span><span></span><span></span></div>
      </div>
      <div class="np-body">
        <div class="np-label">Now playing</div>
        <div class="np-mount" id="np-mount">—</div>
      </div>
      <button class="np-stop" id="np-stop" onclick="stop()" aria-label="Stop playback">
        <svg viewBox="0 0 24 24" width="22" height="22"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
    </section>

    <!-- Volume -->
    <section class="card volume-card">
      <div class="rule"></div>
      <div class="vol-row">
        <svg class="vol-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M3 9v6h4l5 5V4L7 9H3z"/>
        </svg>
        <input type="range" id="volume" min="0" max="100" step="1" value="50"
          oninput="onVolumeInput(this.value)" onchange="setVolume(this.value)" aria-label="Volume">
        <span class="vol-val" id="vol-val">50</span>
      </div>
    </section>

    <!-- Stations -->
    <section class="stations">
      <div class="section-head">
        <h2>Live streams</h2>
        <button class="refresh" onclick="init()" aria-label="Refresh">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M17.65 6.35A8 8 0 1 0 19.73 14h-2.08A6 6 0 1 1 16.24 7.76L13 11h7V4l-2.35 2.35z"/>
          </svg>
          <span>Refresh</span>
        </button>
      </div>

      <div class="filter-row">
        <button class="chip is-active" id="chip-all" onclick="setFilter('all')">All</button>
        <button class="chip" id="chip-fav" onclick="setFilter('fav')">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 20.3l-1.45-1.32C5.4 14.36 2 11.28 2 7.5 2 4.42 4.42 2 7.5 2c1.74 0 3.41.81 4.5 2.09C13.09 2.81 14.76 2 16.5 2 19.58 2 22 4.42 22 7.5c0 3.78-3.4 6.86-8.55 11.54L12 20.3z"/></svg>
          Favourites
        </button>
      </div>

      <div id="livemounts" class="station-list"></div>
      <div id="empty-state" class="empty" hidden>
        <div class="rule"></div>
        <p id="empty-text">No live streams right now.</p>
      </div>
    </section>

    <!-- Settings panel content is in the overlay below -->
  </main>

  <!-- Settings overlay (top-level menu) -->
  <div class="settings-overlay" id="settings-overlay" hidden onclick="if(event.target===this)toggleSettings()">
    <aside class="settings-panel" role="dialog" aria-label="Settings" aria-modal="true">
      <div class="settings-head">
        <h2>Settings</h2>
        <button class="close-btn" onclick="toggleSettings()" aria-label="Close settings">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M18.3 5.7L12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7l1.4-1.4L10.6 10.6l6.3-6.3z"/></svg>
        </button>
      </div>

      <div class="setting-block">
        <div class="setting-label">About</div>
        <div class="about-row">
          <span>Version</span>
          <span id="version" class="mono">—</span>
        </div>
      </div>

      <div class="setting-block">
        <div class="setting-label">Diagnostics</div>
        <textarea id="log" rows="8" readonly spellcheck="false"></textarea>
      </div>
    </aside>
  </div>

  </main>

  <footer class="footer">
    <a href="https://livemasjid.com">Streams by Livemasjid</a>
  </footer>

  <script src="js/ebilal.js"></script>
</body>

</html>
