# Shared by the HTTP and HTTPS servers in ebilal_site_nginx.
# Installed by setup.sh to /etc/nginx/snippets/ebilal-locations.conf

root /opt/ebilal/ebilal_web;
index index.html;

location / {
	try_files $uri $uri/ =404;
	# Revalidate on every load (cheap: unchanged files answer 304 via ETag), so
	# phones pick up in-app updates instead of running a stale cached copy.
	add_header Cache-Control "no-cache";
}

# Service worker and manifest must never be cached stale, or app updates stall
location = /sw.js {
	add_header Cache-Control "no-cache";
}
location = /manifest.webmanifest {
	types { }
	default_type application/manifest+json;
	add_header Cache-Control "no-cache";
}

# This device's CA certificate, for the setup page (generated by ebilal-tls)
location /ca/ {
	alias /var/lib/ebilal/ca-public/;
	add_header Cache-Control "no-store";
	types {
		application/x-x509-ca-cert          crt cer;
		application/x-apple-aspen-config    mobileconfig;
		text/plain                          txt;
	}
}

location /api {
	proxy_set_header   X-Real-IP        $remote_addr;
	proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
	proxy_set_header   Host             $host;
	rewrite /api/(.*) /$1  break;
	proxy_pass http://127.0.0.1:8000/;
}
